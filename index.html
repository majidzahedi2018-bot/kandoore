        <h1>کندوره | سفارش آنلاین لباس سنتی هرمزگان</h1>
        <p>کندوره پلتفرم آنلاین سفارش دوخت لباس سنتی هرمزگان است؛ کندوره زری‌بافی، بادله، شلوار بندری و گلابتون‌دوزی را با خیاطان برتر بندرعباس سفارش دهید. پرداخت امانی (بیعانه تا تحویل نهایی محفوظ می‌ماند) و تحویل اختصاصی.</p>
        <p>هنرهای دوزی هرمزگان شامل گلابتون‌دوزی، بادله‌دوزی، خوس‌دوزی، شک‌بافی و زری‌بافی است. کاوشگر شما جاوااسکریپت را غیرفعال کرده است؛ لطفاً برای تجربه کامل «کاندوره» از مرورگری با جاوااسکریپت فعال استفاده کنید.</p>
        <h2>نحوه سفارش لباس سنتی</h2>
        <p>۱) ثبت سفارش  ۲) تایید خیاط  ۳) پرداخت بیعانه  ۴) دوخت  ۵) تحویل با کد</p>
        <h2>ضمانت و پرداخت امن</h2>
        <p>بیعانه شما تا تحویل نهایی در «کاندوره» محفوظ می‌ماند و فرآیند سفارش با ضمانت امانی همراه است. خیاطان عضو «کاندوره» تأییدشده و رتبه‌بندی‌شده هستند.</p>
