<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0705"/>
      <stop offset="50%" stop-color="#1A120B"/>
      <stop offset="100%" stop-color="#0A0705"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D76E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#gold)" text-anchor="middle">کَندوره</text>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" opacity="0.9">اصالت در دوخت، اعتماد در پرداخت</text>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="28" fill="#D4AF37" text-anchor="middle" opacity="0.7">سفارش آنلاین لباس سنتی هرمزگان</text>
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" opacity="0.5">بادله • شلوار بندری • زری‌بافی • گلابتون‌دوزی</text>
  <line x1="400" y1="480" x2="800" y2="480" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="20" fill="#D4AF37" text-anchor="middle" opacity="0.6">kandoore.ir</text>
</svg>